name: hushbug
description: "Hushbug - a free pass-and-play imposter party word game."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  audioplayers: ^6.8.1
  dio: ^5.11.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.3
  intl: ^0.20.3
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  sqlite3: ^3.9.0
  supabase_flutter: ^2.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  drift_dev: ^2.35.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/packs/
    - assets/sounds/
    - assets/blocklist.txt
    - assets/brands.txt
